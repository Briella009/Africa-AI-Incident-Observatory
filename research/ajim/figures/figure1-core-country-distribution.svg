<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">AAIO core records by primary country</title>
<desc id="desc">Horizontal bar chart of 19 frozen core records. Nigeria and South Africa have five records each, Kenya three, and six countries one each.</desc>
<rect width="1200" height="760" fill="white"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.h{font-size:30px;font-weight:700}.s{font-size:18px;fill:#444}.l{font-size:18px}.v{font-size:18px;font-weight:700}.n{font-size:15px;fill:#555}.g{stroke:#ddd;stroke-width:1}</style>
<text x="60" y="62" class="h">AAIO core records by primary country</text>
<text x="60" y="98" class="s">Frozen core dataset, n=19. Counts describe documentation, not national prevalence.</text>
