<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Evidence confidence distribution</title>
<desc id="desc">Grouped bar chart comparing AAIO core incidents and multilingual candidates across evidence confidence grades A, B and C.</desc>
<rect width="1200" height="760" fill="white"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.h{font-size:30px;font-weight:700}.s{font-size:18px;fill:#444}.l{font-size:18px}.v{font-size:17px;font-weight:700}.n{font-size:15px;fill:#555}.g{stroke:#ddd;stroke-width:1}</style>
<text x="60" y="62" class="h">Evidence-confidence distribution</text>
<text x="60" y="98" class="s">Core incidents (n=19) versus multilingual discovery candidates (n=9)</text>
<line x1="120" y1="600" x2="1120" y2="600" class="g"/><line x1="120" y1="510" x2="1120" y2="510" class="g"/><line x1="120" y1="420" x2="1120" y2="420" class="g"/><line x1="120" y1="330" x2="1120" y2="330" class="g"/><line x1="120" y1="240" x2="1120" y2="240" class="g"/><line x1="120" y1="150" x2="1120" y2="150" class="g"/>
<text x="95" y="606" class="n">0</text><text x="95" y="516" class="n">2</text><text x="95" y="426" class="n">4</text><text x="95" y="336" class="n">6</text><text x="95" y="246" class="n">8</text><text x="95" y="156" class="n">10</text>
<rect x="255" y="150" width="95" height="450" fill="#333"/><text x="302" y="140" class="v" text-anchor="middle">10</text>
<rect x="365" y="285" width="95" height="315" fill="#888"/><text x="412" y="275" class="v" text-anchor="middle">7</text>
<text x="357" y="640" class="l" text-anchor="middle">A</text>
<rect x="555" y="240" width="95" height="360" fill="#333"/><text x="602" y="230" class="v" text-anchor="middle">8</text>
<rect x="665" y="510" width="95" height="90" fill="#888"/><text x="712" y="500" class="v" text-anchor="middle">2</text>
<text x="657" y="640" class="l" text-anchor="middle">B</text>
<rect x="855" y="555" width="95" height="45" fill="#333"/><text x="902" y="545" class="v" text-anchor="middle">1</text>
<rect x="965" y="600" width="95" height="0" fill="#888"/><text x="1012" y="590" class="v" text-anchor="middle">0</text>
<text x="957" y="640" class="l" text-anchor="middle">C</text>
<rect x="330" y="684" width="22" height="14" fill="#333"/><text x="360" y="696" class="n">Core</text>
<rect x="510" y="684" width="22" height="14" fill="#888"/><text x="540" y="696" class="n">Multilingual candidates</text>
<text x="60" y="735" class="n">Candidate confidence does not itself promote a record into the core dataset.</text>
</svg>
