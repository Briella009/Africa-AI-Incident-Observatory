name: Validate incident data
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/validate.py
      - run: python scripts/validate_multilingual.py
      - run: python scripts/validate_operational.py
      - run: python scripts/validate_release.py
      - run: python scripts/validate_metadata.py
      - run: pytest -q
      - name: Smoke-test deterministic interoperability export
        run: |
          python scripts/export_interoperability.py \
            --output /tmp/aaio-interoperability-v1.json \
            --sha-output /tmp/aaio-interoperability-v1.sha256
